name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 for action runners ahead of the forced migration
    # on 2026-06-02 (Node.js 20 actions will be removed 2026-09-16).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # Version is read from "packageManager" in package.json — no duplicate here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Provide dummy values so Astro/vite doesn't hard-fail on missing
          # env vars during the CI build. No secrets needed for a build check.
          DASHBOARD_PASSWORD: ci-placeholder
          ICAL_URL_NEST: https://example.com/nest.ics
          ICAL_URL_MASTER: https://example.com/master.ics
          ICAL_URL_NOMAD: https://example.com/nomad.ics

      - name: Test
        run: pnpm test
